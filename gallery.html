<!DOCTYPE html>
<html lang="ar">

</head>
<body class="page-two">

  <canvas id="petals"></canvas>

  <div class="gallery">

      <img src="photo1.jpg" alt="Photo 1">
      <p class="quote">ويغزل حبًّا وراحة</p>
    </div>

    <div class="card delay2">
      <img src="photo2.jpg" alt="Photo 2">

    <p>وفي السكون يولد الأمان</p>
    <p>لا وعد، فقط بقاء</p>
